<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#111827"
    >

    <meta
        name="description"
        content="A simple and professional student expense tracking app."
    >

    <title>Student Expense Tracker</title>

    <link rel="stylesheet" href="style.css">

    <!-- PWA -->
    <link rel="manifest" href="manifest.json">
</head>

<body>

    <main class="container">

        <header class="app-header">

            <div class="app-icon">
                💰
            </div>

            <h1>Student Expense Tracker</h1>

            <p class="subtitle">
                Keep track of your daily spending.
            </p>

        </header>


        <!-- TOTAL SPENDING -->

        <section class="total-box">

            <p>Total Spending</p>

            <h2 id="total">
                ₦0
            </h2>

        </section>


        <!-- BUDGET -->

        <section class="budget-box">

            <h2>
                💰 My Budget
            </h2>

            <input
                type="number"
                id="budgetAmount"
                placeholder="Enter your budget (₦)"
                min="1"
            >

            <button id="saveBudget">
                Save Budget
            </button>

            <div class="budget-details">

                <p>
                    Budget:
                    <strong id="budget">₦0</strong>
                </p>

                <p>
                    Spent:
                    <strong id="spent">₦0</strong>
                </p>

                <p>
                    Remaining:
                    <strong id="remaining">₦0</strong>
                </p>

            </div>

            <p id="budgetWarning"></p>

            <div class="progress-container">

                <div id="progressBar"></div>

            </div>

            <p id="progressText">
                0% used
            </p>

        </section>


        <!-- ADD EXPENSE -->

        <section class="expense-form">

            <h2>
                ➕ Add Expense
            </h2>

            <input
                type="text"
                id="expenseName"
                placeholder="What did you spend on?"
            >

            <select id="expenseCategory">

                <option value="">
                    Choose category
                </option>

                <option value="Food">
                    🍔 Food
                </option>

                <option value="Transport">
                    🚌 Transport
                </option>

                <option value="School">
                    📚 School
                </option>

                <option value="Data">
                    📱 Data
                </option>

                <option value="Other">
                    🛍️ Other
                </option>

            </select>


            <input
                type="number"
                id="expenseAmount"
                placeholder="Amount (₦)"
                min="1"
            >


            <input
                type="date"
                id="expenseDate"
            >


            <button
                type="button"
                id="addButton"
                class="primary-button"
            >
                Add Expense
            </button>


            <button
                type="button"
                id="clearButton"
                class="danger-button"
            >
                Clear All Expenses
            </button>


            <button
                type="button"
                id="resetBudget"
                class="secondary-button"
            >
                Reset Budget
            </button>

        </section>


        <!-- EXPENSE LIST -->

        <section class="expenses-section">

            <h2 class="list-title">
                📋 Expenses
                <span class="count">
                    <span id="expenseCount">0</span>
                </span>
            </h2>

            <div id="expenseList"></div>

        </section>


        <!-- SUMMARY -->

        <section class="summary-box">

            <h2>
                📊 Spending Summary
            </h2>

            <div id="summaryList"></div>

        </section>


        <footer>

            <p>
                Student Expense Tracker
            </p>

            <small>
                Built with HTML, CSS & JavaScript
            </small>

        </footer>

    </main>


    <script src="script.js"></script>

</body>

</html>
