<!DOCTYPE html><html lang="en">  <head>  
    <meta charset="UTF-8">  
    <meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Student Expense Tracker</title>  <link rel="stylesheet" href="style.css">  </head><body><div class="container">  <h1>💰 Student Expense Tracker</h1>  

<p class="subtitle">  
    Keep track of your daily spending.  
</p>  

<div class="total-box">  
    <p>Total Spending</p>  
    <h2 id="total">₦0</h2>  
</div>  
<div class="budget-box">  

<h2>💰 My Budget</h2>  

<input  
    type="number"  
    id="budgetAmount"  
    placeholder="Enter your budget (₦)"  
>  

<button id="saveBudget">  
    Save Budget  
</button>  

<p>Budget: <span id="budget">₦0</span></p>  

<p>Spent: <span id="spent">₦0</span></p>  

<p>Remaining: <span id="remaining">₦0</span></p>  
  <p id="budgetWarning"></p>  
  <div class="progress-container">  
<div id="progressBar"></div>

</div>  <p id="progressText">0% used</p>  </div>  <div class="expense-form">  

    <input  
        type="text"  
        id="expenseName"  
        placeholder="What did you spend on?"  
    >  
     <select id="expenseCategory">  
<option value="">Choose category</option>  
<option value="Food">🍔 Food</option>  
<option value="Transport">🚌 Transport</option>  
<option value="School">📚 School</option>  
<option value="Data">📱 Data</option>  
<option value="Other">🛍️ Other</option>

</select>  <input  
        type="number"  
        id="expenseAmount"  
        placeholder="Amount (₦)"  
    >  
      <input  
type="date"  
id="expenseDate"  
required

> 

<button type="button" id="addButton">  
        Add Expense  
    </button>  
   <button type="button" id="clearButton">Clear All Expenses</button>  
   <button type="button" id="resetBudget">  
Reset Budget

</button>  </div>  

<h2 class="list-title">  
📋 Expenses (<span id="expenseCount">0</span>)  
</h2>  

<div id="expenseList"></div>

</div>  
  <div class="summary-box">  <h2>📊 Spending Summary</h2>  

<div id="summaryList"></div>

</div>  <script src="script.js"></script>  </body>  
</html>
